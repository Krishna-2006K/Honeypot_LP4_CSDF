<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Log In ‹ WordPress</title><style>*{box-sizing:border-box}body{margin:0;background:#f0f0f1;color:#3c434a;font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}.wrap{width:min(320px,calc(100% - 36px));margin:auto;padding-top:7vh}.logo{width:80px;height:80px;margin:0 auto 24px;display:grid;place-items:center;color:#2271b1;font-size:72px;font-family:Georgia,serif}.box{background:#fff;padding:24px;box-shadow:0 1px 4px #0002}label{display:block;margin:0 0 5px;font-size:14px}input[type=text],input[type=password]{width:100%;height:39px;margin:0 0 16px;border:1px solid #8c8f94;border-radius:3px;padding:0 9px;font-size:17px}.row{display:flex;align-items:center;gap:6px;margin-bottom:16px}.row input{margin:0;accent-color:#2271b1}.submit{width:100%;border:0;border-radius:3px;background:#2271b1;color:white;font-weight:600;padding:10px;cursor:pointer}.error{border-left:4px solid #d63638;background:white;padding:11px;margin-bottom:15px}.links{margin-top:17px}.links a{display:block;color:#50575e;margin:12px 0;text-decoration:none}.foot{text-align:center;font-size:11px;color:#646970;margin-top:27px}</style></head><body><main class="wrap"><div class="logo">W</div><form class="box" method="post" action="/wp-login.php"><!--LOGIN_ERROR--><label for="log">Username or Email Address</label><input id="log" name="log" type="text" autocomplete="username" required autofocus><label for="pwd">Password</label><input id="pwd" name="pwd" type="password" autocomplete="current-password" required><div class="row"><input id="remember" type="checkbox" name="rememberme"><label for="remember">Remember Me</label></div><button class="submit" type="submit">Log In</button></form><div class="links"><a href="#">Lost your password?</a><a href="#">← Go to WordPress</a></div><div class="foot">Honeypie local decoy · Form submissions are recorded in the audit log</div></main></body></html>
