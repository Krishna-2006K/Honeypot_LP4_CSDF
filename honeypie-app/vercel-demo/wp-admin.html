<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Log In ‹ WordPress</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f0f0f1;color:#3c434a;font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}.wrap{width:min(320px,calc(100% - 36px));margin:auto;padding-top:7vh}.logo{width:80px;height:80px;margin:0 auto 24px;display:grid;place-items:center;color:#2271b1;font:72px Georgia,serif}.box{background:#fff;padding:24px;box-shadow:0 1px 4px #0002}label{display:block;margin:0 0 5px;font-size:14px}input{width:100%;height:39px;margin:0 0 16px;border:1px solid #8c8f94;border-radius:3px;padding:0 9px;font-size:17px}.remember{display:flex;align-items:center;gap:6px;margin-bottom:16px}.remember input{width:16px;height:16px;margin:0;accent-color:#2271b1}.submit{width:100%;border:0;border-radius:3px;background:#2271b1;color:#fff;font-weight:600;padding:10px;cursor:pointer}.message{margin-top:14px;color:#646970;font-size:12px;line-height:1.5}.links{margin-top:17px}.links a{display:block;color:#50575e;margin:12px 0;text-decoration:none}.foot{text-align:center;font-size:11px;color:#646970;margin-top:25px}</style>
</head>
<body><main class="wrap"><div class="logo" aria-label="WordPress">W</div><div class="box"><label for="username">Username or Email Address</label><input id="username" autocomplete="off"><label for="password">Password</label><input id="password" type="password" autocomplete="new-password"><label class="remember"><input type="checkbox"> Remember Me</label><button class="submit" type="button" onclick="document.getElementById('message').hidden=false">Log In</button><div class="message" id="message" hidden>Demo preview only. Login submissions are disabled and no information is sent or stored.</div></div><div class="links"><a href="#">Lost your password?</a><a href="#">← Go to WordPress</a></div><div class="foot">Honeypie demo · Credential collection disabled</div></main></body>
</html>
